services:
  verimed-nli:
    build:
      context: .
      dockerfile: Dockerfile
    image: verimed-nli:latest
    container_name: verimed-nli-service
    ports:
      - "8000:8000"
    environment:
      - SIMULATION_MODE=true
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
